<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>Criar conta</h1>
    <p class="subtitle">Preencha os dados abaixo para se cadastrar.</p>

    <form id="cadastroForm" novalidate>
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" minlength="3" autocomplete="name" required>

      <label for="nascimento">Data de nascimento</label>
      <input type="date" id="nascimento" name="nascimento" required>

      <label for="sexo">Sexo</label>
      <select id="sexo" name="sexo" required>
        <option value="">Selecione</option>
        <option value="Masculino">Masculino</option>
        <option value="Feminino">Feminino</option>
        <option value="Outro">Outro</option>
      </select>

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" name="telefone" inputmode="numeric" maxlength="11" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" minlength="6" autocomplete="new-password" required>

      <button type="submit">Cadastrar</button>
      <p id="mensagem" class="mensagem" role="alert"></p>
    </form>

    <p class="link-text">Já possui uma conta? <a href="index.html">Faça login</a></p>
  </main>
  <script src="js/cadastro.js"></script>
</body>
</html>
